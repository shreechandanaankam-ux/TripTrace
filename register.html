<!DOCTYPE html>

<html>

<head>

<title>Register</title>

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="container">

<div class="left">

<h1>Join TripTrace</h1>

<p>

Create your account and start exploring amazing destinations.

</p>

<img src="https://images.unsplash.com/photo-1469854523086-cc02fe5d880?w=900">

</div>

<div class="right">

<h2>Create Account</h2>

<input id="newUser" placeholder="Username">

<input id="newPass" type="password" placeholder="Password">

<select id="newRole">

<option>Traveller</option>

<option>Mentor</option>

</select>

<button onclick="register()">

Register

</button>

<div class="bottom">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

</div>

<script src="auth.js"></script>

</body>

</html>
